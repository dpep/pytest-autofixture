[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-autofixture"
dynamic = ["version"]
authors = [{name = "Daniel Pepper"}]
description = "simplify pytest fixtures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
  # https://pypi.org/classifiers/
  "Framework :: Pytest",
  "Topic :: Software Development :: Testing"
]
requires-python = ">= 3.11"
dependencies = ["pytest >= 8.4"]

[project.entry-points.pytest11]
autofixture = "pytest_autofixture"

[project.urls]
Homepage = "https://github.com/dpep/pytest-autofixture"

[dependency-groups]
dev = ["ruff"]

[tool.setuptools]
packages = ["pytest_autofixture"]

[tool.setuptools.dynamic]
version = {attr = "pytest_autofixture.__version__"}

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# bare fixture names are the point
"tests/**" = ["B018", "F821"]
